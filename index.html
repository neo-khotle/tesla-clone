<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <div class="logo"> 
            <img src="resources/logo.svg" alt="Tesla logo">
        </div>

        <div class="middle-menu">
            <a href="#">Vehicles</a>
            <a href="#">Energy</a>
            <a href="#">Charging</a>
            <a href="#">Semi</a>
            <a href="#">Discover</a>
            <a href="#">Shop</a>
        </div>

        <div class="options">
            <a href="https://www.tesla.com/support">
                <img src="resources/help.svg" class="option-icons" alt="Help icon">
            </a>
            <a href="#">
                <img src="resources/lang.svg" class="option-icons" alt="Language icon">
            </a>
            <a href="https://auth.tesla.com/oauth2/v1/authorize?redirect_uri=https%3A%2F%2Fwww.tesla.com%2Fteslaaccount%2Fowner-xp%2Fauth%2Fcallback&response_type=code&client_id=ownership&scope=offline_access%20openid%20ou_code%20email%20phone&audience=https%3A%2F%2Fownership.tesla.com%2F&locale=en-US">
                <img src="resources/profile.svg" class="option-icons" alt="Profile icon">
            </a>
        </div>

        <div class="menu-btn">
            <button>Menu</button>
        </div>


    </header>

    <main>

        <section id="hero-banner">
            
            <section class="slideshow">

                <div class="slide active">
                    <img src="https://digitalassets.tesla.com/tesla-contents/image/upload/f_auto,q_auto/Homepage-Promo-Model-Y-L-Family-Desktop-NA.jpg" alt="First slide">
                </div>

                <div class="slide">
                    <img src="https://digitalassets.tesla.com/tesla-contents/image/upload/f_auto,q_auto/Homepage-Promo-Model-3-Desktop-US.jpg" alt="Second slide">
                </div>

                <div class="slide">
                    <img src="https://digitalassets.tesla.com/tesla-contents/image/upload/f_auto,q_auto/Homepage-Promo-Model-Y-L-Seats-Desktop-AU-NZ.jpg" alt="Third slide">
                </div>

                <button class="prev" aria-label="Previous slide">&#10094;</button>
                <button class="next" aria-label="Next slide">&#10095;</button>

            </section>

            <h1 class="main-heading"> Model Y</h1>
            <h4 class="sub-heading">1.99% APR Available</h4>

            <div class="buttons">
                <button>Order Now</button>
                <button>Learn More</button>
            </div>

        </section>

    </main>

    <section id="footer">

    </section>
    
</body>
</html>
